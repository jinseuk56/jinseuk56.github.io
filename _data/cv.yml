    Research & Capabilities:
      - name: Data-driven and AI-Assisted Microscopy Analysis
        highlights:
          - "Blind source separation and feature extraction from high-dimensional microscopy data through dimensionality reduction and clustering."
          - "Physically interpretable data-driven analysis of spectrum and diffraction datasets and correlated multimodal measurements."

      - name: Correlative (S)TEM Characterization
        highlights:
          - "4D-STEM, STEM-EELS/EDX, electron tomography, and multimodal acquisition for local structure, chemistry, and phase analysis."
          - "Application to functional oxides, energy materials, amorphous systems, and plasmonic nanostructures."

      - name: Open Microscopy Software and Workflows
        highlights:
          - "Python and DigitalMicrograph tools for reproducible analysis, including DRCA, CAETomo, SENDePSIC, GMS3 Tools, etc."
          - "Interactive and scriptable workflows connecting acquisition, processing, classification, and reconstruction."

